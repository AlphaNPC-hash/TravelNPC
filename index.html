<title>Travel NPC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#faf7f2; --panel:#ffffff; --ink:#1c1b19; --ink-2:#6f6a60; --muted:#94897a;
  --line:rgba(28,27,25,.12); --line-2:rgba(28,27,25,.07);
  --indigo:#233d63; --indigo-2:#3a5b8c; --indigo-wash:#e9edf4;
  --vermillion:#c1440e; --vermillion-wash:#faeae1;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#4a3aa7;
  --radius:14px; --radius-sm:9px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121212; --panel:#1a1a19; --ink:#f3f1ec; --ink-2:#c3c2b7; --muted:#8b8880;
    --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.07);
    --indigo:#7d9bcf; --indigo-2:#5a7bab; --indigo-wash:#1e2a3d;
    --vermillion:#e2703c; --vermillion-wash:#33221a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121212; --panel:#1a1a19; --ink:#f3f1ec; --ink-2:#c3c2b7; --muted:#8b8880;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.07);
  --indigo:#7d9bcf; --indigo-2:#5a7bab; --indigo-wash:#1e2a3d;
  --vermillion:#e2703c; --vermillion-wash:#33221a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Thai","Noto Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* Hard safety net: nothing on any tab should ever be able to push the page
   wider than the viewport (this is what caused content to spill off the
   right edge on narrow phones). overflow-x:hidden on body is the backstop;
   min-width:0 on flex rows below is the actual fix, since a flex child's
   default min-width is "auto" (its content's natural width), which is what
   let long unbroken text force its row wider than the screen instead of
   wrapping or shrinking. */
h1,h2,h3,.display{font-family:"Kanit","Noto Sans Thai",sans-serif;font-weight:700;text-wrap:balance;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit}
a{color:var(--indigo-2)}
::selection{background:var(--indigo-wash)}

/* height (not min-height) gives .layout/.main a definite size to shrink
   against, which is what makes .main's overflow-y:auto actually clip and
   scroll internally instead of letting the whole document grow past the
   viewport — with min-height alone the bottom tab bar could end up
   overlapping the last field/card on narrow screens instead of sitting
   below everything. */
.app{height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--paper) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 16px}
.topbar .brand{display:flex;align-items:center;gap:9px;font-family:"Kanit","Noto Sans Thai",sans-serif;font-weight:800;font-size:18px;letter-spacing:.01em;white-space:nowrap}
.topbar .brand .npc{color:var(--vermillion)}
.topbar .brand .mark{width:28px;height:28px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px color-mix(in srgb, var(--indigo) 35%, transparent)}
.topbar .brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
.tripswitch{flex:1;min-width:0}
.tripswitch select{width:100%;max-width:320px;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13.5px;font-family:inherit}
.budgetchip{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--indigo-wash);color:var(--indigo);display:flex;gap:6px;align-items:center}
.budgetchip.over{background:color-mix(in srgb, var(--critical) 16%, transparent);color:var(--critical)}

.layout{flex:1;display:flex;min-height:0}
.nav{flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:10px 6px;gap:2px;width:84px}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink-2);padding:10px 4px;border-radius:12px;cursor:pointer;font-size:11px;line-height:1.2;transition:background .15s,color .15s}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
/* Each tab gets its own accent color when active/selected, drawn from the
   same swatch palette already used for budget categories — so it reads as
   one consistent color system rather than random colors, and it's obvious
   at a glance (not just a shade of the same gray) which tab you're on. A
   small dot under the label reinforces it even when the icon+text color
   shift alone might be easy to miss. */
.nav button.active{font-weight:700;background:var(--indigo-wash);color:var(--indigo)}
.nav button.active::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:currentColor}
.nav button[data-tab="setup"].active{color:var(--s6);background:color-mix(in srgb, var(--s6) 14%, transparent)}
.nav button[data-tab="hotels"].active{color:var(--s4);background:color-mix(in srgb, var(--s4) 16%, transparent)}
.nav button[data-tab="timeline"].active{color:var(--vermillion);background:var(--vermillion-wash)}
.nav button[data-tab="budget"].active{color:var(--s3);background:color-mix(in srgb, var(--s3) 14%, transparent)}
.nav button[data-tab="docs"].active{color:var(--s1);background:color-mix(in srgb, var(--s1) 14%, transparent)}
.nav button[data-tab="reminders"].active{color:var(--s5);background:color-mix(in srgb, var(--s5) 16%, transparent)}
.nav button[data-tab="export"].active{color:var(--s2);background:color-mix(in srgb, var(--s2) 14%, transparent)}
.nav button:disabled{opacity:.32;cursor:not-allowed}
.nav button:not(:disabled):not(.active):hover{background:var(--line-2)}

.main{flex:1;min-width:0;overflow-y:auto;padding:22px 20px 90px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.screentitle{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.screentitle h1{font-size:22px}
.screentitle p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px}

.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:hover{background:var(--indigo-2)}
.btn.accent{background:var(--vermillion);border-color:var(--vermillion);color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--critical);border-color:color-mix(in srgb, var(--critical) 35%, var(--line))}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2);flex:none}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card h2{font-size:15.5px;display:flex;align-items:center;gap:8px;min-width:0}
.card h2 svg{width:17px;height:17px;stroke:var(--indigo);fill:none;stroke-width:1.7;flex:none}
.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
/* Collapsible cards: a <details class="card"> with a <summary class="cardhead">
   header reuses the same header styling, just made clickable with the
   default disclosure marker swapped for our own chevron that flips on open. */
.card summary{cursor:pointer;list-style:none}
.card summary::-webkit-details-marker{display:none}
/* A round +/- badge instead of a chevron — clearer at a glance that a
   section is collapsed with more inside (+) vs. already expanded (−). The
   icon itself is a fixed plus (horizontal + vertical bar); the vertical bar
   just fades out on [open], which is what turns the + into a −. */
.card summary .chev{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.card summary .chev svg{width:12px;height:12px}
.card summary .chev svg .vert{transition:opacity .15s}
.card[open] summary .chev{background:var(--indigo-wash);color:var(--indigo)}
.card[open] summary .chev svg .vert{opacity:0}
.hint{color:var(--muted);font-size:12px;margin-top:3px}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;color:var(--ink);font-family:inherit;width:100%}
.field input.mono,.field textarea.mono{font-family:"IBM Plex Mono",monospace}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--indigo-2);outline-offset:1px}
.field input,.field select,.txtinput,.field input[type="date"],.field input[type="time"]{height:38px;box-sizing:border-box}
.field textarea{height:auto}
.txtinput{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:13.5px;color:var(--ink);font-family:inherit;width:100%;box-sizing:border-box}
.txtinput:focus{outline:2px solid var(--indigo-2);outline-offset:1px}
.pricechip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13px;color:var(--ink-2);cursor:pointer;background:var(--paper);transition:background .15s,border-color .15s,color .15s;user-select:none}
.pricechip input{margin:0;accent-color:var(--indigo)}
.pricechip:hover{border-color:var(--indigo-2)}
.pricechip.checked{background:var(--indigo-wash);border-color:var(--indigo-2);color:var(--indigo);font-weight:600}
.weightrow{display:grid;grid-template-columns:1fr 3fr auto;align-items:center;gap:10px;padding:7px 0}
.weightrow .wlabel{font-size:12.5px;color:var(--ink-2);min-width:0}
.weightrow .wval{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--indigo-2);width:14px;text-align:right;flex:none}
.weightrow input[type="range"]{width:100%;accent-color:var(--indigo);height:20px}
@media (max-width:420px){.weightrow{grid-template-columns:72px 1fr auto}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}

.rowcard{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;display:flex;flex-direction:column;gap:10px;background:var(--paper);min-width:0}
.rowcard .rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.rowcard .rowhead b{font-size:13px;min-width:0;overflow-wrap:anywhere}

.uploadline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filelabel{display:inline-flex;align-items:center;gap:7px;border:1px dashed var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--indigo-2);cursor:pointer}
.filelabel:hover{border-color:var(--indigo-2)}
.filelabel input{display:none}
.filelabel svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.uploadstatus{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.uploadstatus svg{width:13px;height:13px;flex:none;stroke:currentColor;fill:none;stroke-width:2.4}
.uploadstatus.ok{color:var(--good)}
.uploadstatus.err{color:var(--critical)}
.uploadstatus .uploadthumb{width:26px;height:26px;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.uploadstatus .spin{color:var(--indigo-2)}

.pastetoggle{appearance:none;background:none;border:none;color:var(--indigo-2);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:4px 0;font-family:inherit}
.pastetoggle:hover{color:var(--indigo)}
.pasterow{display:none;flex-direction:column;gap:8px;margin:8px 0 12px;padding:12px;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--radius-sm)}
.pasterow.open{display:flex}
.pasterow textarea{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;font-size:12.5px;color:var(--ink);font-family:inherit;width:100%;resize:vertical;min-height:70px}
.pasterow textarea:focus{outline:2px solid var(--indigo-2);outline-offset:1px}

.layoverhint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);padding:2px 2px 0}
.layoverhint svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}

.saved{font-size:11.5px;color:var(--good);display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
.setupcta{display:flex;justify-content:flex-end}
.setupctabottom{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px;text-align:center}
.setupctabottom .hint{margin:0}

/* trip list */
.tripgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tripcard{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel);display:flex;flex-direction:column;gap:10px;cursor:pointer}
.tripcard:hover{border-color:var(--indigo-2)}
.tripcardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tripcard h3{font-size:16.5px;min-width:0}
.tripcard .meta{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.tripcard .meta .mono{color:var(--ink-2)}
.tripcard .del{flex:none}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty svg{width:34px;height:34px;stroke:var(--muted);fill:none;stroke-width:1.4;margin-bottom:10px}

/* timeline */
.timeline{display:flex;flex-direction:column}
.leg{display:grid;grid-template-columns:64px 1fr;column-gap:12px}
.legrail{display:flex;flex-direction:column;align-items:center}
.legdot{width:34px;height:34px;border-radius:10px;background:var(--indigo-wash);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.legdot svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.legline{flex:1;width:2px;background:var(--line);min-height:14px}
.legbody{padding-bottom:22px}
.legcard{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel);padding:13px 14px}
.legtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.legmain{min-width:0}
.legroute{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.legwhen{font-size:12px;color:var(--ink-2);margin-top:2px;overflow-wrap:anywhere}
.legtimes{font-family:"IBM Plex Mono",monospace;font-size:13px;text-align:right;flex:none}
.legcost{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--indigo-2)}
.legnote{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legactions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.legdot.sightseeing{background:var(--vermillion-wash);color:var(--vermillion)}
.legcard.transfer{border-left:3px solid var(--indigo)}
.legcard.sightseeing{border-left:3px solid var(--vermillion)}
.legcatbadge{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;border-radius:5px;margin-right:7px;vertical-align:middle}
.legcatbadge.transfer{background:var(--indigo-wash);color:var(--indigo)}
.legcatbadge.sightseeing{background:var(--vermillion-wash);color:var(--vermillion)}
.tlLegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.tlLegend span{display:inline-flex;align-items:center;gap:6px}
.tlSwatch{width:10px;height:10px;border-radius:3px;display:inline-block}
.tlSwatch.transfer{background:var(--indigo)}
.tlSwatch.sightseeing{background:var(--vermillion)}
.tlActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-2);display:none}
.detail.open{display:block}
.walksteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.walksteps li{display:flex;gap:8px;font-size:12.5px;align-items:flex-start}
.walksteps .n{flex:none;width:18px;height:18px;border-radius:6px;background:var(--vermillion-wash);color:var(--vermillion);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.alts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.alt{display:flex;justify-content:space-between;font-size:12px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px}
.alt .mono{color:var(--ink-2)}

.emptyai{border:1px dashed var(--line);border-radius:var(--radius);padding:26px 20px;text-align:center}
.emptyai p{color:var(--ink-2);font-size:13px;max-width:400px;margin:8px auto 16px}

/* budget */
.stattiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.stattiles{grid-template-columns:1fr 1fr}}
.tile{border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;background:var(--panel)}
.tile .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.tile .val{font-family:"IBM Plex Mono",monospace;font-size:19px;margin-top:4px}
.tile .val.good{color:var(--good)}
.tile .val.critical{color:var(--critical)}
.pbar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden;position:relative}
.pbar .fill{height:100%;background:var(--indigo);border-radius:999px}
.pbar .fill.over{background:var(--critical)}
.catbar{display:flex;flex-direction:column;gap:9px}
.catrow{display:grid;grid-template-columns:minmax(0,90px) 1fr minmax(0,70px);align-items:center;gap:8px;font-size:12.5px}
.catrow span{min-width:0;overflow-wrap:anywhere}
.catrow .swatch{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}
.catrow .track{height:9px;border-radius:999px;background:var(--line-2)}
.catrow .track .f{height:100%;border-radius:999px}
.catrow .amt{text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--ink-2)}
.explist{display:flex;flex-direction:column;gap:0;min-width:0}
.exprow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px;gap:10px;min-width:0}
.exprow:last-child{border-bottom:none}
.exprow>span{min-width:0;overflow-wrap:anywhere}
.exprow>span:last-child{flex:none;overflow-wrap:normal}
.exprow .tag{font-size:10.5px;color:var(--ink-2);background:var(--paper);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;margin-right:8px;white-space:normal}

/* documents */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.doctile{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;background:var(--panel);display:flex;flex-direction:column}
.doctile .thumb{aspect-ratio:1;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden}
.doctile .thumb img{width:100%;height:100%;object-fit:cover}
.doctile .thumb svg{width:26px;height:26px;stroke:var(--muted);fill:none;stroke-width:1.4}
.doctile .cap{padding:7px 8px;font-size:11px;color:var(--ink-2);border-top:1px solid var(--line-2);display:flex;justify-content:space-between;gap:4px}
.doctile .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doctile{position:relative}
.doctile .savedbadge{position:absolute;top:5px;left:5px;width:18px;height:18px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.doctile .savedbadge svg{width:10px;height:10px;stroke:#fff;stroke-width:3;fill:none}
.doctile.uploading .thumb{opacity:.5}
.doctile.uploading .cap{color:var(--indigo-2)}

/* reminders */
.remrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2);min-width:0}
.remrow:last-child{border-bottom:none}
.remwhen{flex:none;width:80px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--indigo-2)}
.remmid{flex:1;min-width:0}
.remmid b{font-size:13px;display:block;overflow-wrap:anywhere}
.remmid .loc{font-size:11.5px;color:var(--ink-2);overflow-wrap:anywhere}

/* export */
.exportcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;background-image:radial-gradient(circle at 100% 0%, var(--indigo-wash), transparent 45%);min-width:0}
.exportcard .etitle{font-family:"Kanit","Noto Sans Thai",sans-serif;font-size:24px;font-weight:700;overflow-wrap:anywhere}
.exportcard .esub{color:var(--ink-2);font-size:12.5px;margin-top:3px;overflow-wrap:anywhere}
.eseg{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-2);min-width:0}
.eseg h4{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 9px}
.eflight{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px;min-width:0}
.eflight span:first-child{min-width:0;overflow-wrap:anywhere}
.eflight span:last-child{flex:none}
.ehotel{font-size:12.5px;margin-bottom:5px;overflow-wrap:anywhere}
.eleg{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;color:var(--ink-2);min-width:0}
.eleg span:first-child{min-width:0;overflow-wrap:anywhere}
.eleg span:last-child{flex:none}
.efoot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line-2);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* modal */
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modalbg.open{display:flex}
.modal{background:var(--panel);border-radius:var(--radius);max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:20px}
.modal.wide{max-width:760px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal .mhead h3{font-size:16px}
.viewerimg{max-width:100%;border-radius:10px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:16px;font-size:13px;z-index:200;display:none;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:min(90vw,380px);width:max-content;text-align:center;line-height:1.4}
.toast.show{display:block}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.thinking{display:flex;align-items:center;gap:9px;color:var(--ink-2);font-size:13px;padding:14px 0}

.disclaim{font-size:11.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;background:var(--indigo-wash);border-radius:10px;padding:9px 12px}
.disclaim svg{width:13px;height:13px;stroke:var(--indigo);flex:none;margin-top:1px}

@media (min-width:768px){
  .main{padding:30px 32px 40px}
}
@media (max-width:767px){
  .main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  /* position:fixed (not just a flex sibling) so the tab bar stays pinned to
     the viewport no matter what — this doesn't depend on .app's 100dvh
     sizing actually working on every device/host, it's anchored outright.
     A 2-column-per-row grid (7 tabs -> 4+3) keeps every button a full-width
     grid cell instead of a flex-shrunk sliver, so labels never clip or
     force horizontal overflow, and each tap target stays comfortably big. */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:3px;border-right:none;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--paper) 94%, transparent);backdrop-filter:blur(10px);box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  .nav button{width:100%;min-height:52px;padding:8px 2px;border-radius:10px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom))}
}
</style>

/* ---------- i18n: language + theme ---------- */
/* ---------- i18n: language + theme (adjustable, persisted per device) ----------
   Two independent, persisted device preferences:
   - LANG ('th'|'en'): every static UI string routes through L(key, vars);
     stored data (trip names, notes, category/mode enum VALUES) is never
     translated in place — only how it's DISPLAYED changes, so switching
     language never rewrites or breaks existing saved trips. AI prompts stay
     written in Thai (already tested and reliable) with a short directive
     appended asking for English field values when LANG is 'en'.
   - THEME (null=follow system, 'light', 'dark'): mirrors the CSS variable
     scheme already defined at the top of this file (prefers-color-scheme +
     [data-theme] overrides) — this just lets a person pin it either way. */
const LANG_KEY = 'tabinote_lang_v1';
const THEME_KEY = 'tabinote_theme_v1';
function getLang(){
  try { const v = localStorage.getItem(LANG_KEY); if (v==='en'||v==='th') return v; } catch(e){}
  return 'th';
}
function setLang(lang){
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  document.documentElement.lang = lang==='en' ? 'en' : 'th';
  refreshWholeApp();
}
function getThemeChoice(){
  try { const v = localStorage.getItem(THEME_KEY); if (v==='light'||v==='dark') return v; } catch(e){}
  return null; // null = follow system
}
function setThemeChoice(choice){
  try {
    if (choice) localStorage.setItem(THEME_KEY, choice);
    else localStorage.removeItem(THEME_KEY);
  } catch(e){}
  applyThemeChoice();
}
function applyThemeChoice(){
  const choice = getThemeChoice();
  if (choice) document.documentElement.dataset.theme = choice;
  else delete document.documentElement.dataset.theme;
}
function locale(){ return getLang()==='en' ? 'en-US' : 'th-TH'; }

let toastT;

function openModal(html, wide){
  const bg = document.getElementById('modalBg');
  const body = document.getElementById('modalBody');
  body.className = 'modal' + (wide ? ' wide' : '');
  body.innerHTML = html;
  bg.classList.add('open');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }
// Set true only while the mandatory "ตั้งชื่อก่อนแก้ไข" modal is open — that
// one specific modal must not be dismissible by clicking the backdrop
// (that's the whole point of "forced"); every other modal keeps working
// exactly as before.
let modalBlocking = false;
document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg' && !modalBlocking) closeModal(); });
// Custom confirm dialog instead of window.confirm() — pages published as an
// artifact run inside a sandboxed iframe, and browsers commonly block
// native confirm()/alert()/prompt() dialogs there (they silently no-op and
// return false instead of showing anything), which made every destructive
// action gated behind confirm() silently do nothing. This renders the same
// "are you sure" prompt as a normal in-page modal so it actually works.
function confirmModal(message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    let settled = false;
    const finish = v => { if (settled) return; settled = true; resolve(v); closeModal(); };
    openModal(`
      <div class="mhead"><h3>${escapeHtml(opts.title||L('confirm_default_title'))}</h3><button class="iconbtn" id="cf_x">${ICON.x}</button></div>
      <p style="margin:0 0 16px;color:var(--ink-2);font-size:13.5px">${escapeHtml(message)}</p>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" id="cf_cancel">${L('confirm_cancel')}</button>
        <button class="btn danger" id="cf_ok">${escapeHtml(opts.okLabel||L('confirm_default_ok'))}</button>
      </div>
    `);
    document.getElementById('cf_ok').addEventListener('click', ()=>finish(true));
    document.getElementById('cf_cancel').addEventListener('click', ()=>finish(false));
    document.getElementById('cf_x').addEventListener('click', ()=>finish(false));
    // closing via the backdrop click (wired globally above) should also resolve false
    const bg = document.getElementById('modalBg');
    const onBgClick = e => { if (e.target.id==='modalBg') { finish(false); bg.removeEventListener('click', onBgClick); } };
    bg.addEventListener('click', onBgClick);
  });
}

async function initSupabase(){
  if (!USE_SUPABASE) return null;
  try {
    const { createClient } = window.supabase;
    supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // Wrap Supabase API to work with artifact capDb code
    capDb = {
      collection: (name) => ({
        add: async (data) => {
          const { data: inserted, error } = await supabaseClient
            .from(name)
            .insert([data])
            .select();
          if (error) throw error;
          return {id: inserted[0].id};
        },
        onSnapshot: (callback) => {
          // Initial fetch
          supabaseClient.from(name).select().then(({ data }) => {
            const docs = (data||[]).map(d => ({
              id: d.id,
              data: () => d
            }));
            callback({docs});
          });
          // Realtime subscription with new API
          supabaseClient
            .channel(`${name}-changes`)
            .on('postgres_changes', { event: '*', schema: 'public', table: name }, (payload) => {
              supabaseClient.from(name).select().then(({ data }) => {
                const docs = (data||[]).map(d => ({
                  id: d.id,
                  data: () => d
                }));
                callback({docs});
              });
            })
            .subscribe();
        }
      }),
      doc: (path) => {
        const [collection, id] = path.split('/');
        return {
          set: async (data) => {
            const { error } = await supabaseClient
              .from(collection)
              .upsert({...data, id})
              .select();
            if (error) throw error;
          },
          update: async (patch) => {
            const { error } = await supabaseClient
              .from(collection)
              .update(patch)
              .eq('id', id)
              .select();
            if (error) throw error;
          },
          delete: async () => {
            const { error } = await supabaseClient
              .from(collection)
              .delete()
              .eq('id', id);
            if (error) throw error;
          },
          onSnapshot: (callback, errCallback) => {
            // Initial fetch
            supabaseClient.from(collection).select().eq('id', id).then(({ data, error }) => {
              if (data && data[0]) {
                callback({exists: true, data: () => data[0]});
              } else {
                callback({exists: false});
              }
            });
            // Realtime subscription with new API
            supabaseClient
              .channel(`${collection}-${id}-changes`)
              .on('postgres_changes', { event: '*', schema: 'public', table: collection }, (payload) => {
                if (payload.new && payload.new.id === id) {
                  callback({exists: true, data: () => payload.new});
                }
              })
              .subscribe();
          }
        };
      }
    };
    return capDb;
  } catch(e) {
    console.error('Supabase init failed:', e);
    return null;
  }
}

async function safeUse(name){

// Wraps a db-capability call so it can never leave a button press looking
// like it did nothing: some failure modes (a dropped connection, a browser
// that silently stalls the postMessage bridge to the capability host — seen
// in the wild on iOS Safari/in-app browsers for non-owner viewers) neither
// resolve nor reject the underlying promise. Without a timeout, an await on
// that promise just hangs forever with zero feedback. 8s is generous for a
// small doc write but still short enough that a real hang doesn't feel like
// the app is broken.
function withTimeout(promise, ms){
  ms = ms || 8000;
  return new Promise((resolve, reject)=>{
    let settled = false;
    const timer = setTimeout(()=>{
      if (settled) return; settled = true;
      reject(Object.assign(new Error('timeout'), {code:'timeout'}));
    }, ms);
    promise.then(
      v=>{ if (settled) return; settled = true; clearTimeout(timer); resolve(v); },
      e=>{ if (settled) return; settled = true; clearTimeout(timer); reject(e); }
    );
  });
}

/* ---- owner-only ban list, enforced by a db write rule (not by our own code) ---- */
let amOwner = false;
let banList = [];
async function detectOwner(){
  if (!capDb) return;
  try { await capDb.doc('control/ownerProbe').set({ pingAt: new Date().toISOString() }); amOwner = true; }
  catch(e){ amOwner = false; }
}
function watchBanlist(){
  if (!capDb) return;
  capDb.doc('control/banlist').onSnapshot(snap=>{
    const data = snap.exists ? snap.data() : null;
    banList = (data && Array.isArray(data.names)) ? data.names : [];
    checkIfBanned();
  }, ()=>{});
}
function checkIfBanned(){
  const v = getViewerIdentity();
  if (v.name && banList.includes(v.name) && !amOwner) lockAppRemoved(L('banned_message'));
}
async function banName(name){
  if (!amOwner || !name) return;
  const next = Array.from(new Set([...(banList||[]), name]));
  try { await capDb.doc('control/banlist').set({names: next}); toast(L('toast_ban_done',{name})); closeModal(); }
  catch(e){ toast(L('toast_ban_fail')); }
}
async function unbanName(name){
  if (!amOwner) return;
  const next = (banList||[]).filter(n=>n!==name);
  try { await capDb.doc('control/banlist').set({names: next}); toast(L('toast_unban_done',{name})); openPresenceModal(); }
  catch(e){ toast(L('toast_unban_fail')); }
}

/* ---------- hotel loyalty status & AI hotel advisor ----------
   Loyalty status is a personal thing, not trip-specific, so it lives in
   localStorage (this device only) instead of on the trip document — the
   same held statuses show up no matter which trip is open. The AI call
   never invents a real-time room price (only a rough price tier), and the
   booking links below are built here in plain JS, not by the AI, so they
   always point somewhere real rather than a guessed/broken URL. */
const LOYALTY_KEY = 'tabinote_loyalty_v1';
const LOYALTY_CHAINS = ['Marriott Bonvoy','Hilton Honors','IHG One Rewards','World of Hyatt','Accor ALL','Best Western Rewards','Radisson Rewards','Wyndham Rewards','Shangri-La Circle'];
function getLoyaltyProfile(){
  try { const raw = localStorage.getItem(LOYALTY_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return [];
}
function setLoyaltyProfile(arr){ try { localStorage.setItem(LOYALTY_KEY, JSON.stringify(arr)); } catch(e){} }
function renderLoyaltyChips(){
  const list = getLoyaltyProfile();
  return list.length ? list.map((l,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;background:var(--indigo-wash);color:var(--indigo);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px"><b>${escapeHtml(l.chain)}</b>${l.tier?' · '+escapeHtml(l.tier):''}<button class="iconbtn" data-del-loyalty="${i}" style="width:20px;height:20px;background:transparent;border:none;color:var(--indigo)">${ICON.x}</button></span>`).join('')
    : `<span class="hint" style="margin:0">${L('loy_empty_hint')}</span>`;
}

// How much weight (1-5 each) to give price vs. travel convenience vs.
// reviews when the AI ranks hotels — a personal preference like loyalty
// status, so it lives in localStorage (this device) and carries over
// between searches instead of resetting to some fixed default every time.
const HOTEL_WEIGHTS_KEY = 'tabinote_hotelweights_v1';
const HOTEL_WEIGHT_DEFAULT = { price: 3, convenience: 3, reviews: 3 };
function getHotelWeights(){
  try {
    const raw = localStorage.getItem(HOTEL_WEIGHTS_KEY);
    if (raw) return Object.assign({}, HOTEL_WEIGHT_DEFAULT, JSON.parse(raw));
  } catch(e){}
  return Object.assign({}, HOTEL_WEIGHT_DEFAULT);
}
function setHotelWeights(w){ try { localStorage.setItem(HOTEL_WEIGHTS_KEY, JSON.stringify(w)); } catch(e){} }

function agodaSearchUrl(name){ return 'https://www.agoda.com/search?q=' + encodeURIComponent(name); }
function bookingSearchUrl(name, checkin, checkout){
  let u = 'https://www.booking.com/searchresults.html?ss=' + encodeURIComponent(name);
  if (checkin) u += '&checkin=' + checkin;
  if (checkout) u += '&checkout=' + checkout;
  return u;
}
function officialSiteSearchUrl(name){ return 'https://www.google.com/search?q=' + encodeURIComponent(name + ' official site'); }
function googleHotelsPasteText(name, checkin, checkout){
  return (checkin && checkout) ? `${name}, check-in ${checkin}, check-out ${checkout}` : name;
}
// Rough stay-date guess from the trip's own flights (last leg of flightOut
// -> first leg of flightBack) — used only for Booking.com's checkin/checkout
// params, which it documents as reliable. Agoda has no confirmed stable
// date params, so its link is built from the hotel name only.
function tripDateRangeForBooking(t){
  const outDate = (t.flightOut && t.flightOut.legs && t.flightOut.legs.length) ? t.flightOut.legs[t.flightOut.legs.length-1].date : '';
  const backDate = (t.flightBack && t.flightBack.legs && t.flightBack.legs.length) ? t.flightBack.legs[0].date : '';
  return { checkin: outDate||'', checkout: backDate||'' };
}

function buildHotelAdvisorPrompt(area, loyalty, acceptedPriceLevels, weights){

  return `คุณเป็นผู้เชี่ยวชาญด้านโรงแรมและโปรแกรมสมาชิกโรงแรม (hotel loyalty program) ในญี่ปุ่น ช่วยแนะนำโรงแรมจริงสำหรับพักที่ย่าน "${area}" จำนวน 3-5 แห่ง ${loyaltyLine}${priceLine}${weightLine} `+
    `พิจารณาปัจจัยเหล่านี้ประกอบ: ระดับค่าใช้จ่ายโดยประมาณ, สิทธิประโยชน์จากสถานะสมาชิก, ความสะดวกในการเดินทาง, รีวิว/ชื่อเสียงทั่วไป, และบริการพิเศษ เช่น รถรับส่งสนามบินฟรีหรือบริการรับส่งไปยังที่ต่างๆ `+
    `ห้ามระบุราคาห้องพักเป็นตัวเลขหรืออ้างว่าเป็นราคาปัจจุบัน เพราะไม่ใช่ข้อมูลเรียลไทม์ ให้ใช้ระดับราคาคร่าวๆ แทนเท่านั้น และสิทธิประโยชน์จากสถานะสมาชิกให้ระบุว่าเป็นการประมาณการทั่วไปเท่านั้น ไม่ใช่การยืนยันจริงจากทางโรงแรม\n\n${HOTEL_ADVISOR_SCHEMA}` + aiLangSuffix();

function wireHotelSearch(t){
  function refreshLoyaltyChips(){
    document.getElementById('loyChips').innerHTML = renderLoyaltyChips();
    document.querySelectorAll('[data-del-loyalty]').forEach(b=>b.addEventListener('click', ()=>{
      const list = getLoyaltyProfile();
      list.splice(Number(b.dataset.delLoyalty),1);
      setLoyaltyProfile(list);
      refreshLoyaltyChips();
    }));
  }
  refreshLoyaltyChips();
  document.getElementById('btnLoyAdd').addEventListener('click', ()=>{
    const chain = document.getElementById('loyChainInput').value.trim().slice(0,40);
    const tier = document.getElementById('loyTierInput').value.trim().slice(0,30);
    if (!chain) { toast(L('toast_loy_chain_required')); return; }
    const list = getLoyaltyProfile();
    if (list.some(l=>l.chain.toLowerCase()===chain.toLowerCase())) { toast(L('toast_loy_dup')); return; }
    list.push({chain, tier});
    setLoyaltyProfile(list);
    refreshLoyaltyChips();
    document.getElementById('loyChainInput').value = '';
    document.getElementById('loyTierInput').value = '';
  });
  // Sliders persist immediately on drag (not only on search) so the
  // preference sticks even if the person navigates away before searching.
  document.querySelectorAll('.advWeight').forEach(r=>{
    r.addEventListener('input', ()=>{
      document.getElementById('wval_'+r.dataset.weight).textContent = r.value;
      const w = getHotelWeights();
      w[r.dataset.weight] = Number(r.value);
      setHotelWeights(w);
    });
  });
  document.querySelectorAll('.pricechip').forEach(lbl=>{
    const chk = lbl.querySelector('input');
    chk.addEventListener('change', ()=> lbl.classList.toggle('checked', chk.checked));
  });
  document.getElementById('btnAdvSearch').addEventListener('click', ()=> runHotelAdvisor(t));
}
async function runHotelAdvisor(t){
  const area = document.getElementById('advArea').value.trim();
  if (!area) { toast(L('toast_hotel_area_required')); return; }
  if (!capSample) { toast(L('toast_ai_unavailable_page')); return; }
  const acceptedPriceLevels = Array.from(document.querySelectorAll('.advPriceChk:checked')).map(c=>c.value);
  const weights = {};
  document.querySelectorAll('.advWeight').forEach(r=>{ weights[r.dataset.weight] = Number(r.value); });
  const results = document.getElementById('advResults');
  const btn = document.getElementById('btnAdvSearch');
  btn.disabled = true;
  results.innerHTML = `<div class="thinking"><span class="spin"></span>${L('hotel_searching')}</div>`;
  try {
    const loyalty = getLoyaltyProfile();
    const data = await capSample.json(buildHotelAdvisorPrompt(area, loyalty, acceptedPriceLevels, weights), { modelTier: 'complex' });
    const hotels = Array.isArray(data && data.hotels) ? data.hotels : [];
    renderHotelAdvisorResults(hotels, area, t);
  } catch(e) {
    results.innerHTML = `<div class="disclaim">${ICON.info}${escapeHtml(sampleErrToThai(e))}</div>`;
  }
  btn.disabled = false;
}
function renderHotelAdvisorResults(hotels, area, t){
  const results = document.getElementById('advResults');
  if (!hotels.length) { results.innerHTML = `<div class="hint">${L('hotel_no_results')}</div>`; return; }
  const dr = tripDateRangeForBooking(t);
  results.innerHTML = `
    <div class="disclaim">${ICON.info}${L('hotel_disclaim')}</div>
    ${hotels.map((h,i)=>renderHotelAdvisorCard(h,i,dr)).join('')}
  `;
  hotels.forEach((h,i)=>{
    const b = document.getElementById('adv_add_'+i);
    if (b) b.addEventListener('click', ()=> addRecommendedHotel(t, h, area, b));
    const c = document.getElementById('adv_copy_'+i);
    if (c) c.addEventListener('click', ()=>{
      navigator.clipboard.writeText(googleHotelsPasteText(h.name, dr.checkin, dr.checkout)).then(()=>toast(L('toast_copied_search'))).catch(()=>toast(L('toast_copy_fail')));
    });
  });
}
function renderHotelAdvisorCard(h,i,dr){

  return `<div class="rowcard">

      ${h.priceLevel?`<span style="display:inline-flex;padding:2px 9px;border-radius:999px;background:var(--line-2);color:var(--ink-2);font-size:11px">${L('hotel_price_level_prefix')}: ${escapeHtml(h.priceLevel)}</span>`:''}

    ${h.whyThisHotel?`<p style="margin:0;font-size:12.5px">${escapeHtml(h.whyThisHotel)}</p>`:''}
    ${h.convenience?`<p style="margin:0;font-size:12.5px;color:var(--ink-2)">${L('hotel_convenience_prefix')}: ${escapeHtml(h.convenience)}</p>`:''}

/* ---------- storage layer: db capability with localStorage fallback ---------- */
let storeReady = false;
let trips = {}; // id -> data
let tripOrder = [];
let currentTripId = null;
const LS_KEY = 'tabinote_trips_v1';

function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e){ return {}; } }
function lsSave(all){ try { localStorage.setItem(LS_KEY, JSON.stringify(all)); } catch(e){} }

function initStore(){
  if (storeReady) return;
  storeReady = true;
  if (capDb) {
    capDb.collection('trips').onSnapshot(snap=>{
      const next = {};
      // db snapshot documents are frozen — shallow-clone before normalizeTrip
      // touches flightOut/flightBack, so we never try to mutate a frozen object.
      snap.docs.forEach(d=>{ next[d.id] = normalizeTrip(Object.assign({}, d.data())); });
      const hadCurrent = !!(currentTripId && trips[currentTripId]);
      trips = next;
      tripOrder = snap.docs.map(d=>d.id).sort((a,b)=> (trips[b].updatedAt||'').localeCompare(trips[a].updatedAt||''));
      renderTripSelect();
      if (currentTripId && !trips[currentTripId]) currentTripId = null;
      // Avoid tearing down the setup form (and losing focus/cursor), or the
      // hotel-search tab's just-fetched AI results and in-progress form, on
      // every echo of our own writes; only force a re-render when the trip
      // is freshly arriving (e.g. right after creation) or we're on another
      // tab entirely.
      const skipRerender = (screenTab === 'setup' || screenTab === 'hotels') && hadCurrent && currentTripId && trips[currentTripId];
      if (!skipRerender) render(); else updateBudgetChip();
    }, err=>{ toast(L('toast_db_connect_fail')); bootLocal(); });
  } else {
    bootLocal();
  }
}
function bootLocal(){
  trips = lsLoad();
  Object.keys(trips).forEach(id=> normalizeTrip(trips[id])); // JSON.parse output is fresh/mutable, safe to normalize in place
  tripOrder = Object.keys(trips).sort((a,b)=> (trips[b].updatedAt||'').localeCompare(trips[a].updatedAt||''));
  renderTripSelect();
  render();
}
function blankLeg(){ return {date:'',flightNo:'',fromAirport:'',toAirport:'',departTime:'',arriveTime:''}; }
function blankFlight(){ return { legs:[blankLeg()], uploadedDocName:'' }; }
function firstLeg(f){ return (f && f.legs && f.legs[0]) || blankLeg(); }
function lastLeg(f){ return (f && f.legs && f.legs.length) ? f.legs[f.legs.length-1] : blankLeg(); }
function blankTrip(name){
  const now = new Date().toISOString();
  return { name: name || L('default_new_trip_name'), travelers: 1, budgetJpy: 0,
    flightOut: blankFlight(),
    flightBack: blankFlight(),
    hotels: [], waypoints: [], itinerary: [], expenses: [], members: [],
    activityLog: [],
    createdAt: now, updatedAt: now };
}
// Builds the next activityLog array (capped so it can't grow forever) for a
// given trip id, tagging the entry with whoever is currently set as this
// viewer's display name. Called from saveTrip/createTrip/deleteTrip only
// AFTER requireIdentity() has resolved, so v.name is always set by here.
const ACTIVITY_LOG_MAX = 60;
function withActivityEntry(id, label){
  const v = getViewerIdentity();
  const prev = (trips[id] && Array.isArray(trips[id].activityLog)) ? trips[id].activityLog : [];
  const next = prev.concat([{ who: v.name || L('history_no_name'), action: label, at: new Date().toISOString() }]);
  return next.length > ACTIVITY_LOG_MAX ? next.slice(next.length - ACTIVITY_LOG_MAX) : next;
}
async function createTrip(){
  await requireIdentity();
  const data = blankTrip();
  data.activityLog = [{ who: getViewerIdentity().name || L('history_no_name'), action: L('create_trip_log'), at: data.createdAt }];
  if (capDb) {
    try {
      const ref = await withTimeout(capDb.collection('trips').add(data));
      currentTripId = ref.id;
    } catch (e) {
      // Never let this fail silently (see withTimeout comment) — tell the
      // person what happened and still give them a usable trip on this
      // device rather than a dead button.
      toast(L('toast_create_trip_fail'));
      const id = 't' + Date.now();
      trips[id] = data; tripOrder.unshift(id); lsSave(trips);
      currentTripId = id;
    }
  } else {
    const id = 't' + Date.now();
    trips[id] = data; tripOrder.unshift(id); lsSave(trips);
    currentTripId = id;
  }
  renderTripSelect();
  goTab('setup');
}
async function saveTrip(id, patch, actionLabel){
  await requireIdentity();
  patch.updatedAt = new Date().toISOString();
  patch.activityLog = withActivityEntry(id, actionLabel || L('default_trip_edit_log'));
  if (capDb) {
    try {
      await withTimeout(capDb.doc('trips/'+id).update(patch));
    } catch (e) {
      if (e && e.code === 'invalid_argument') {
        try { await withTimeout(capDb.doc('trips/'+id).set(Object.assign({}, trips[id]||{}, patch))); }
        catch (e2) { toast(L('toast_save_trip_fail')); }
      } else {
        // Same silent-hang risk as createTrip — surface it instead of
        // leaving the person wondering whether their edit was saved.
        toast(L('toast_save_trip_fail'));
      }
    }
  } else {
    trips[id] = Object.assign({}, trips[id], patch); lsSave(trips);
    // Same reasoning as the onSnapshot echo-guard above: don't blow away the
    // setup form or the hotel-search tab's live results/AI output on every
    // save while the user is actively on one of those screens — callers that
    // need an immediate visual update on THOSE tabs already do their own
    // targeted paintTab()/DOM update after calling saveTrip().
    if (!(screenTab === 'setup' || screenTab === 'hotels')) render();
  }
  flashSaved();
}
async function deleteTrip(id){
  const ok = await confirmModal(L('delete_trip_confirm_msg'), {title:L('del_trip_title'), okLabel:L('delete_trip_confirm_ok')});
  if (!ok) return;
  await requireIdentity();
  if (capDb) {
    try { await withTimeout(capDb.doc('trips/'+id).delete()); }
    catch (e) { toast(L('toast_delete_trip_fail')); return; }
  } else {
    delete trips[id]; tripOrder = tripOrder.filter(t=>t!==id); lsSave(trips);
  }
  if (currentTripId === id) currentTripId = null;
  if (!capDb) { render(); renderTripSelect(); }
  idbDeleteTripFiles(id);
}
let saveFlashT;
function flashSaved(){
  const el = document.getElementById('savedFlag');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(saveFlashT);
  saveFlashT = setTimeout(()=>el.classList.remove('show'), 1600);
}
// db snapshots are delivered frozen; always hand out a fresh, mutable deep
// clone so the setup/timeline/budget screens can edit fields in place.
function curTrip(){
  if (!currentTripId || !trips[currentTripId]) return null;
  let t;
  try { t = JSON.parse(JSON.stringify(trips[currentTripId])); }
  catch(e){ t = trips[currentTripId]; }
  return normalizeTrip(t);
}
// Migrates trips saved before connecting-flight support existed: back then
// flightOut/flightBack were a single flat {date,fromAirport,...} object (one
// leg only, no way to represent a layover). Every trip now flows through
// here so old data keeps working without a one-time destructive migration.
function normalizeFlight(f){
  f = f || {};
  if (Array.isArray(f.legs) && f.legs.length) return f;
  const hadData = f.date || f.flightNo || f.fromAirport || f.toAirport || f.departTime || f.arriveTime;
  const leg = blankLeg();
  if (hadData) Object.assign(leg, {date:f.date||'',flightNo:f.flightNo||'',fromAirport:f.fromAirport||'',toAirport:f.toAirport||'',departTime:f.departTime||'',arriveTime:f.arriveTime||''});
  return { legs:[leg], uploadedDocName: f.uploadedDocName||'' };
}
function normalizeTrip(t){
  if (!t) return t;
  t.flightOut = normalizeFlight(t.flightOut);
  t.flightBack = normalizeFlight(t.flightBack);
  if (!Array.isArray(t.activityLog)) t.activityLog = [];
  return t;
}

/* ---------- IndexedDB for uploaded documents (local to this browser) ---------- */
// This storage is local to one browser/device and is NOT shared through the
// trip's "db" capability, so it is only ever a best-effort convenience —
// some viewer contexts (a strict private-browsing mode, or a viewer whose
// site data is cleared/blocked) cannot use IndexedDB at all. The bug this
// used to have: a single failed open() was cached forever (idbP), so one
// transient failure permanently broke uploads for the rest of that page
// load even if storage recovered a moment later. Fixed below by only
// caching a SUCCESSFUL open — a failure is retried on the next call — and
// by exposing idbHealthCheck() so the Docs tab can tell the person plainly
// when local storage genuinely isn't available here, instead of failing
// silently.
let idbP = null;
function idbOpen(){
  if (idbP) return idbP;
  const attempt = new Promise((resolve,reject)=>{
    if (typeof indexedDB === 'undefined' || !indexedDB) { reject(new Error('no-indexeddb')); return; }
    const req = indexedDB.open('tabinote_files', 1);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if (!db.objectStoreNames.contains('files')) {
        const s = db.createObjectStore('files', {keyPath:'id', autoIncrement:true});
        s.createIndex('tripId','tripId');
      }
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
    req.onblocked = ()=>reject(new Error('idb-blocked'));
  }).catch(err=>{ idbP = null; return null; });
  idbP = attempt;
  return idbP;
}
// Real write+read round trip (not just "did open() resolve") so a false
// "it's working" never gets reported when writes are actually silently
// dropped (seen in some sandboxed/partitioned storage contexts).
async function idbHealthCheck(){
  try {
    const db = await idbOpen();
    if (!db) return false;
    const tid = '__healthcheck__';
    const addedId = await idbAddFile(tid, 'healthcheck', 'text/plain', new Blob(['ok']));
    if (addedId == null) return false;
    const files = await idbListFiles(tid);
    const found = files.some(f=>f.id === addedId);
    await idbDeleteFile(addedId).catch(()=>{});
    return found;
  } catch(e){ return false; }
}
async function idbAddFile(tripId, name, type, blob){
  const db = await idbOpen(); if (!db) return null;
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('files','readwrite');
    const req = tx.objectStore('files').add({tripId, name, type, blob, uploadedAt: new Date().toISOString()});
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbListFiles(tripId){
  const db = await idbOpen(); if (!db) return [];
  return new Promise((resolve)=>{
    const out = [];
    const idx = db.transaction('files','readonly').objectStore('files').index('tripId');
    const req = idx.openCursor(IDBKeyRange.only(tripId));
    req.onsuccess = ()=>{ const c = req.result; if (c){ out.push(c.value); c.continue(); } else resolve(out); };
    req.onerror = ()=>resolve(out);
  });
}
async function idbDeleteFile(id){
  const db = await idbOpen(); if (!db) return;
  db.transaction('files','readwrite').objectStore('files').delete(id);
}
async function idbDeleteTripFiles(tripId){
  const files = await idbListFiles(tripId);
  const db = await idbOpen(); if (!db) return;
  const tx = db.transaction('files','readwrite');
  files.forEach(f=>tx.objectStore('files').delete(f.id));
}

/* ---------- render dispatcher ---------- */
function render(){
  updatePresenceChip();

  if (screenTab === 'home' || !currentTripId) { updateBudgetChip(null); s.innerHTML = renderHome(); wireHome(); return; }
  const t = curTrip();
  if (!t) { updateBudgetChip(null); s.innerHTML = renderHome(); wireHome(); return; }
  updateBudgetChip(t);
  paintTab(t);
}
// Re-render the current tab from an ALREADY up-to-date local trip object —
// used right after a local mutation (add/delete row, AI parse, edit) so the
// screen reflects the change immediately instead of waiting on a store
// round-trip (which for the db backend can lag a render behind, or be
// intentionally skipped while the setup form is mid-edit).
function paintTab(t){
  const s = document.getElementById('screen');
  updateBudgetChip(t);
  if (screenTab === 'setup') { s.innerHTML = renderSetup(t); wireSetup(t); }
  else if (screenTab === 'hotels') { s.innerHTML = renderHotelSearch(t); wireHotelSearch(t); }
  else if (screenTab === 'timeline') { s.innerHTML = renderTimeline(t); wireTimeline(t); }
  else if (screenTab === 'budget') { s.innerHTML = renderBudget(t); wireBudget(t); }
  else if (screenTab === 'docs') { s.innerHTML = renderDocs(t); wireDocs(t); }
  else if (screenTab === 'reminders') { s.innerHTML = renderReminders(t); wireReminders(t); }
  else if (screenTab === 'export') { s.innerHTML = renderExport(t); wireExport(t); }
}
function updateBudgetChip(t){
  const chip = document.getElementById('budgetChip');
  if (t === undefined) t = curTrip();
  if (!t || !t.budgetJpy) { chip.hidden = true; return; }
  const spent = tripTotalSpend(t);
  chip.hidden = false;
  chip.classList.toggle('over', spent > t.budgetJpy);
  chip.textContent = fmtYen(spent) + ' / ' + fmtYen(t.budgetJpy);
}
function tripTotalSpend(t){
  const legSum = (t.itinerary||[]).reduce((a,l)=>a + (Number(l.costYen)||0), 0);
  const expSum = (t.expenses||[]).reduce((a,e)=>a + (Number(e.amountYen)||0), 0);
  return legSum + expSum;
}

function flightHasData(f){
  const l = firstLeg(f);

}
function flightSummaryLine(f){
  const l = firstLeg(f);
  if (!(l.fromAirport || l.toAirport || l.date)) return '';
  const route = (l.fromAirport||'?') + ' → ' + (l.toAirport||'?');

// Layover time between two consecutive legs of the same direction, when it
// can be computed (both legs have a date + the relevant time). Assumes the
// next leg is the same day unless that would put it before the previous
// leg's arrival, in which case it rolls over to the next day (overnight
// connections). Returns null when there isn't enough info to compute it.
function layoverMinutes(prevLeg, nextLeg){
  if (!prevLeg.arriveTime || !nextLeg.departTime) return null;
  const d1 = prevLeg.date || nextLeg.date, d2 = nextLeg.date || prevLeg.date;
  if (!d1 || !d2) return null;
  const t1 = new Date(d1+'T'+prevLeg.arriveTime+':00');
  let t2 = new Date(d2+'T'+nextLeg.departTime+':00');
  if (isNaN(t1) || isNaN(t2)) return null;
  if (t2 < t1) t2 = new Date(t2.getTime() + 24*3600*1000);
  const mins = Math.round((t2 - t1) / 60000);
  return (mins >= 0 && mins < 48*60) ? mins : null;
}
function fmtLayover(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if (!h) return L('fmt_layover_min', {m});
  return m ? L('fmt_layover_hm', {h,m}) : L('fmt_layover_h', {h});
}

/* ---------- PDF text extraction (pdf.js, loaded on first use) ---------- */
// Airlines and hotels almost always send a real (digitally generated) PDF,
// not a scanned image, so we can pull the text straight out of it in the
// browser and feed that text into the SAME plain-text AI prompt used by the
// paste-confirmation-text fallback below. That path needs only the base
// "sample" capability — not the extra "images" grant that many viewer
// contexts (including the one this app is most often opened in) never
// grant — so PDF upload is the reliable path, unlike photo upload.
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = ()=>resolve(); s.onerror = ()=>reject(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
}
let pdfjsReadyP = null;
function ensurePdfJs(){
  if (pdfjsReadyP) return pdfjsReadyP;
  const V = '3.11.174';
  // Try a couple of known cdnjs layouts for this library; harmless if one 404s.
  const candidates = [
    `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/pdf.min.js`,
    `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/legacy/build/pdf.min.js`,
  ];
  pdfjsReadyP = (async () => {
    for (const url of candidates) {
      try {
        await loadScriptOnce(url);
        if (typeof pdfjsLib !== 'undefined') {
          // We deliberately do NOT point workerSrc at a second cdnjs file and
          // do NOT let pdf.js spawn its usual background Worker: this artifact
          // sandbox allows a <script src> tag to load pdf.min.js itself, but
          // blocks the *second*, script-driven fetch pdf.js normally makes to
          // load pdf.worker.min.js (only literal <script> tags are allowed
          // from the CDN allowlist — a library's own runtime fetches are not).
          // Passing disableWorker:true below makes pdf.js parse on the main
          // thread using the code already loaded, so no second fetch happens.
          return true;
        }
      } catch(e){ /* try next candidate */ }
    }
    return false;
  })();
  return pdfjsReadyP;
}
function isPdfFile(file){ return file.type === 'application/pdf' || /\.pdf$/i.test(file.name||''); }
async function extractPdfText(file, maxPages){
  const ok = await ensurePdfJs();
  if (!ok || typeof pdfjsLib === 'undefined') throw new Error('pdfjs-unavailable');
  const buf = await file.arrayBuffer();
  // disableWorker:true is the actual fix here (see the note in ensurePdfJs
  // above) — it runs parsing on the main thread instead of pdf.js trying to
  // spawn a Worker that fetches a second script the sandbox would block.
  const doc = await pdfjsLib.getDocument({data: buf, disableWorker: true}).promise;
  let out = '';
  const n = Math.min(doc.numPages, maxPages || 15);
  for (let i=1;i<=n;i++){
    const page = await doc.getPage(i);
    const content = await page.getTextContent();
    out += content.items.map(it=>it.str).join(' ') + '\n';
    page.cleanup && page.cleanup();
  }
  return out.trim();

// Turns whatever the AI returned into a clean legs[] array. Accepts the
// requested {"legs":[...]} shape, and defensively also accepts a flat
// single-leg object in case the model ever replies in that older shape —
// either way every leg is re-uploaded/re-pasted as a complete replacement
// for this direction, since that's what a fresh ticket photo/email represents.
// Falls back to the existing legs, untouched, if nothing usable came back.
function legsFromAiData(data, fallbackLegs){
  const clean = l => ({date:l.date||'',flightNo:l.flightNo||'',fromAirport:l.fromAirport||'',toAirport:l.toAirport||'',departTime:l.departTime||'',arriveTime:l.arriveTime||''});
  if (data && Array.isArray(data.legs) && data.legs.length) return data.legs.map(clean);
  if (data && (data.date||data.flightNo||data.fromAirport||data.toAirport||data.departTime||data.arriveTime)) return [clean(data)];
  return fallbackLegs;
}
async function parseFlightImage(inputEl, t){
  const file = inputEl.files[0]; if (!file) return;
  const key = inputEl.dataset.parseFlight;
  const statusId = 'status_'+key;
  if (isPdfFile(file)) {
    const params = {
      statusId, file,
      textPrompt: TEXT_FLIGHT_PROMPT,
      label: (key==='flightOut'?L('label_flight_out_short'):L('label_flight_back_short'))+' (PDF) - '+file.name,
      onSuccess: (data, savedId, label) => {
        t[key] = Object.assign({}, t[key], { legs: legsFromAiData(data, t[key].legs), uploadedDocName: savedId ? label : t[key].uploadedDocName });
        saveTrip(currentTripId, {[key]: t[key]}, L('toast_import_flight_from_file',{label}));
        paintTab(t);
      }
    };
    params.retry = () => runPdfParse(params);
    await runPdfParse(params);
    inputEl.value = '';
    return;
  }
  // Capture everything retry needs up front, and have retry call
  // runImageParse directly with the SAME File object — inputEl.value gets
  // cleared right after this (so the same filename can be re-picked later),
  // which would silently no-op a retry that re-read inputEl.files instead.
  const params = {
    statusId, file,
    prompt: FLIGHT_PROMPT + aiLangSuffix(),
    label: (key==='flightOut'?L('label_flight_out_short'):L('label_flight_back_short'))+' - '+file.name,
    onSuccess: (data, savedId, label) => {
      t[key] = Object.assign({}, t[key], {
        legs: legsFromAiData(data, t[key].legs),
        uploadedDocName: savedId ? label : t[key].uploadedDocName,
      });
      saveTrip(currentTripId, {[key]: t[key]}, L('toast_import_flight_from_file',{label}));
      paintTab(t);
    }
  };
  params.retry = () => runImageParse(params);
  await runImageParse(params);
  inputEl.value = '';
}

// Shared upload+read pipeline for both flight and hotel photos, with a
// pre-flight capability/limits check (so we fail with a clear reason
// instead of a generic "อ่านไม่ได้"), a stronger JSON-only prompt, the
// more careful model tier, and a retry affordance wired to the same file.
async function runImageParse({statusId, file, prompt, label, onSuccess, retry}){
  if (!capSample) {
    setUploadStatus(statusId, L('status_ai_unavailable_generic'), 'err');
    toast(L('toast_ai_read_image_unavailable'));
    return;
  }
  setUploadStatus(statusId, `<span class="spin"></span> ${L('status_checking_ai')}`);
  const limits = (capSample.limits ? await capSample.limits().catch(()=>null) : null);
  if (!limits || !limits.images) {
    const el = setUploadStatus(statusId, `${L('status_images_unavailable_here')} ${retryRow()}`, 'err');
    wireRetry(statusId, retry);
    toast(L('toast_upload_image_unavailable_device'));
    return;
  }
  if (file.size > limits.images.maxInputBytes) {
    const mb = Math.round(limits.images.maxInputBytes/1024/1024);
    setUploadStatus(statusId, L('status_file_too_large',{mb}), 'err');
    toast(L('toast_image_too_large'));
    return;
  }
  setUploadStatus(statusId, `<span class="spin"></span> ${L('status_uploading_reading')}`);
  try {
    const data = await capSample.json(prompt, { images: file, modelTier: 'default' });
    setUploadStatus(statusId, `<span class="spin"></span> ${L('status_read_success_saving')}`);
    const savedId = await idbAddFile(currentTripId, label, file.type, file).catch(()=>null);
    onSuccess(data, savedId, label);
    if (savedId) toast(L('toast_upload_success_saved_docs'));
    else toast(L('toast_read_success_save_failed'));
  } catch(e){
    const msg = sampleErrToThai(e);
    const canRetry = ['upstream_error','invalid_json','rate_limited','image_rejected'].includes(e && e.code);
    setUploadStatus(statusId, escapeHtml(msg) + (canRetry ? ' ' + retryRow() : ''), 'err');
    if (canRetry) wireRetry(statusId, retry);
    toast(msg);
  }
}
// PDF counterpart to runImageParse: extracts the text client-side (pdf.js,
// works for any normal digitally-generated PDF — not a scanned photo) and
// hands it to the plain-text AI path below, so it needs only the base
// "sample" capability and keeps working even where "images" is never
// granted. `textPrompt` is TEXT_FLIGHT_PROMPT/TEXT_HOTEL_PROMPT — a
// function of the extracted text, not a ready-made prompt string.
async function runPdfParse({statusId, file, textPrompt, label, onSuccess, retry}){
  if (!capSample) {
    setUploadStatus(statusId, L('status_ai_unavailable_generic'), 'err');
    toast(L('toast_ai_read_pdf_unavailable'));
    return;
  }
  setUploadStatus(statusId, `<span class="spin"></span> ${L('status_pdf_opening')}`);
  let text;
  try {
    text = await extractPdfText(file);
  } catch(e){
    setUploadStatus(statusId, `${L('status_pdf_open_failed')} ${retryRow()}`, 'err');
    wireRetry(statusId, retry);
    toast(L('toast_pdf_open_failed'));
    return;
  }
  if (!text || text.replace(/\s/g,'').length < 8) {
    setUploadStatus(statusId, L('status_pdf_no_text'), 'err');
    toast(L('toast_pdf_scan_maybe'));
    return;
  }
  setUploadStatus(statusId, `<span class="spin"></span> ${L('status_pdf_read_ok_summarizing')}`);
  try {
    const data = await capSample.json(textPrompt(text.slice(0,14000)), { modelTier: 'default' });
    setUploadStatus(statusId, `<span class="spin"></span> ${L('status_read_success_saving')}`);
    const savedId = await idbAddFile(currentTripId, label, file.type||'application/pdf', file).catch(()=>null);
    onSuccess(data, savedId, label);
    if (savedId) toast(L('toast_pdf_read_ok_saved_docs'));
    else toast(L('toast_read_success_save_failed'));
  } catch(e){
    const msg = sampleErrToThai(e);
    const canRetry = ['upstream_error','invalid_json','rate_limited'].includes(e && e.code);
    setUploadStatus(statusId, escapeHtml(msg) + (canRetry ? ' ' + retryRow() : ''), 'err');
    if (canRetry) wireRetry(statusId, retry);
    toast(msg);
  }
}

  listEl.innerHTML = files.map((f,i)=>`<div class="bulkrow" id="bulkrow_${i}"><span class="spin"></span> ${escapeHtml(f.name)} — ${L('bulk_reading')}</div>`).join('');
  const imgLimits = (capSample.limits ? await capSample.limits().catch(()=>null) : null);
  const results = [];
  for (let i=0;i<files.length;i++){
    const f = files[i];
    const row = document.getElementById('bulkrow_'+i);
    try {
      if (isPdfFile(f)) {
        const text = await extractPdfText(f);
        if (!text || text.replace(/\s/g,'').length < 8) {
          row.innerHTML = escapeHtml(L('bulk_pdf_no_text_generic',{filename:f.name}));
          results.push({file:f, data:null}); continue;
        }
        const data = await capSample.json(DOC_CLASSIFY_TEXT_PROMPT(text.slice(0,12000)), { modelTier: 'default' });
        results.push({file:f, data});
        row.innerHTML = `${ICON.check} ${escapeHtml(f.name)} — ${escapeHtml(labelForDocType(data && data.docType))}`;
      } else if (imgLimits && imgLimits.images && f.size <= imgLimits.images.maxInputBytes) {
        const data = await capSample.json(DOC_CLASSIFY_IMAGE_PROMPT(), { images: f, modelTier: 'default' });
        results.push({file:f, data});
        row.innerHTML = `${ICON.check} ${escapeHtml(f.name)} — ${escapeHtml(labelForDocType(data && data.docType))}`;
      } else {
        row.innerHTML = escapeHtml(L('bulk_cant_read_image',{filename:f.name}));
        results.push({file:f, data:null});
      }
    } catch(e){
      row.innerHTML = escapeHtml(L('bulk_read_failed',{filename:f.name, err:sampleErrToThai(e)}));
      results.push({file:f, data:null});
    }
  }
  renderBulkReview(results, t);
}
function renderBulkReview(results, t){

  `;

async function applyBulkImport(results, flightCands, hotelCands, others, t){
  const btn = document.getElementById('bulkConfirm');
  if (btn) { btn.disabled = true; btn.textContent = L('bulk_saving'); }
  let appliedFlights = 0;
  flightCands.forEach((r,i)=>{
    const sel = document.querySelector(`[data-flight-dir="${i}"]`);
    const dir = sel ? sel.value : (i===0?'flightOut':(i===1?'flightBack':'skip'));
    if (dir==='flightOut' || dir==='flightBack') {
      t[dir] = Object.assign({}, t[dir], { legs: legsFromAiData({legs: r.data.flightLegs}, t[dir].legs), uploadedDocName: r.file.name });
      appliedFlights++;
    }
  });
  t.hotels = t.hotels || [];
  hotelCands.forEach(r=>{
    t.hotels.push({ name:r.data.hotel.name||'', address:r.data.hotel.address||'', checkin:r.data.hotel.checkin||'', checkout:r.data.hotel.checkout||'', notes:'', uploadedDocName:r.file.name });
  });
  for (const r of results) {
    await idbAddFile(currentTripId, r.file.name, r.file.type||'application/octet-stream', r.file).catch(()=>null);
  }
  saveTrip(currentTripId, { flightOut:t.flightOut, flightBack:t.flightBack, hotels:t.hotels }, L('bulk_import_log'));
  closeModal();
  paintTab(t);
  toast(L('toast_bulk_done',{flights:appliedFlights, hotels:hotelCands.length, others:others.length}));
}
function sampleErrToThai(e){
  const code = e && e.code;
  const map = {
    not_granted: L('err_not_granted'),
    images_unavailable: L('err_images_unavailable'),
    image_rejected: L('err_image_rejected'),
    invalid_json: L('err_invalid_json'),
    empty_completion: L('err_empty_completion'),
    refused: L('err_refused'),
    rate_limited: L('err_rate_limited'),
    session_expired: L('err_session_expired'),
    sampling_disabled: L('err_sampling_disabled'),
    cancelled: L('err_cancelled'),
    upstream_error: L('err_upstream_error'),
  };
  return map[code] || L('err_fallback', {code: code||L('err_unknown_code')});
}

// Shared driver for both generation phases: shows the "thinking" state,
// calls the AI, normalizes the legs it returns, tags them with `category`,
// and REPLACES only the existing legs of that same category (so running the
// sightseeing phase never touches the transfer legs and vice versa) before
// re-sorting the whole itinerary chronologically.
async function runItineraryGen(t, prompt, category, doneMsg){
  const s = document.getElementById('screen');
  const label = category==='transfer' ? L('itin_label_transfer') : L('itin_label_sightseeing');
  const thinkHtml = `<div class="card thinking" id="thinkBox"><span class="spin"></span>${L('itin_gen_thinking',{label})}</div>`;
  s.insertAdjacentHTML('afterbegin', thinkHtml);
  document.querySelectorAll('#nav button, .btn').forEach(b=>b.disabled = true);
  try {
    const legs = await capSample.json(prompt, { modelTier: 'complex' });
    const arr = Array.isArray(legs) ? legs : (legs.legs || []);
    const newLegs = arr.map(l=>({
      date: l.date||'', title: l.title||'', fromLabel: l.fromLabel||l.from||'', toLabel: l.toLabel||l.to||'',
      mode: l.mode||L('mode_fallback_train'), departTime: l.departTime||'', arriveTime: l.arriveTime||'',
      durationMin: l.durationMin||0, costYen: Number(l.costYen)||0, notes: l.notes||'',
      walking: Array.isArray(l.walking) ? l.walking : [],
      alternatives: Array.isArray(l.alternatives) ? l.alternatives : [],
      category
    }));
    const others = (t.itinerary||[]).filter(l => legCategory(l) !== category);
    t.itinerary = others.concat(newLegs).sort((a,b)=> (a.date+(a.departTime||'99:99')).localeCompare(b.date+(b.departTime||'99:99')));
    saveTrip(currentTripId, {itinerary: t.itinerary}, L('gen_route_ai_log'));
    paintTab(t);
    toast(doneMsg);
  } catch(e){
    paintTab(t);
    toast(sampleErrToThai(e));
  }
  renderTripSelect();
}
async function generateTransfers(t){

function buildSightseeingPrompt(t){
  const transferLegs = (t.itinerary||[]).filter(l => legCategory(l) === 'transfer')

const CAT_ORDER = ['เดินทาง','ที่พัก','อาหาร','ท่องเที่ยว','ช้อปปิ้ง','อื่นๆ'];
const CAT_COLOR = {'เดินทาง':'var(--s1)','ที่พัก':'var(--s2)','อาหาร':'var(--s3)','ท่องเที่ยว':'var(--s4)','ช้อปปิ้ง':'var(--s5)','อื่นๆ':'var(--s6)'};
function categoryTotals(t){
  const totals = {}; CAT_ORDER.forEach(c=>totals[c]=0);
  (t.itinerary||[]).forEach(l=>{ totals['เดินทาง'] += Number(l.costYen)||0; });
  (t.expenses||[]).forEach(e=>{ totals[e.category||'อื่นๆ'] = (totals[e.category||'อื่นๆ']||0) + (Number(e.amountYen)||0); });
  return totals;
}
// Net balance per member (positive = should be paid back, negative = owes
// money), then a minimal set of transfers that settles everyone up — the
// standard greedy "largest creditor pays off largest debtor" simplification.
function computeSettlement(expenses, members){
  const balance = {}; (members||[]).forEach(m=>balance[m]=0);
  (expenses||[]).forEach(e=>{
    const amt = Number(e.amountYen)||0;
    if (!amt) return;
    const splitWith = (e.splitWith && e.splitWith.length) ? e.splitWith.filter(m=>balance.hasOwnProperty(m)) : Object.keys(balance);
    if (!splitWith.length) return;
    const share = amt / splitWith.length;
    if (e.paidBy && balance.hasOwnProperty(e.paidBy)) balance[e.paidBy] += amt;
    splitWith.forEach(m=>{ balance[m] -= share; });
  });
  const creditors = [], debtors = [];
  Object.keys(balance).forEach(m=>{
    const b = Math.round(balance[m]);
    if (b > 0) creditors.push({m, amt:b}); else if (b < 0) debtors.push({m, amt:-b});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const settlements = [];
  let ci=0, di=0;
  while (ci<creditors.length && di<debtors.length){
    const c = creditors[ci], d = debtors[di];
    const amt = Math.min(c.amt, d.amt);
    if (amt > 0) settlements.push({from:d.m, to:c.m, amt});
    c.amt -= amt; d.amt -= amt;
    if (c.amt <= 0) ci++;
    if (d.amt <= 0) di++;
  }
  return {balance, settlements};
}

        const f = files.find(x=>x.id==tile.dataset.file);

        openModal(`<div class="mhead"><h3>${escapeHtml(f.name)}</h3><button class="iconbtn" onclick="closeModal()">${ICON.x}</button></div>
          ${f.type.startsWith('image/') ? `<img class="viewerimg" src="${url}">` : `<embed src="${url}" type="application/pdf" style="width:100%;height:70vh;border-radius:10px">`}`, true);

  document.getElementById('docInput').addEventListener('change', async e=>{
    const files = Array.from(e.target.files||[]);
    e.target.value = '';
    if (!files.length) return;
    toast(files.length>1 ? L('toast_uploading_n',{n:files.length}) : L('toast_uploading_one'));
    let ok = 0, fail = 0;
    for (const f of files) {
      const id = await idbAddFile(currentTripId, f.name, f.type, f).catch(()=>null);
      if (id) ok++; else fail++;
    }
    await refresh();
    if (fail === 0) toast(L('toast_upload_all_ok',{n:ok}));
    else if (ok === 0) toast(L('toast_upload_all_fail',{n:fail}));
    else toast(L('toast_upload_partial',{ok,fail}));
  });
}

function flightLegEvents(f, label){
  const legs = (f && f.legs) || [];
  const multi = legs.length > 1;
  return legs.filter(l=>l.date).map((l,j)=> ({
    date: l.date, time: l.departTime||'',
    title: label + (multi ? L('flight_leg_multi_suffix',{j:j+1,n:legs.length}) : '') + (l.flightNo ? ' '+l.flightNo : ''),
    loc: (l.fromAirport||'') + ' → ' + (l.toAirport||'')
  }));
}
function buildEvents(t){
  const ev = [];
  ev.push(...flightLegEvents(t.flightOut, L('flight_out_label')));
  (t.hotels||[]).forEach(h=>{ if (h.checkin) ev.push({date:h.checkin, time:'15:00', title:L('checkin_title',{name:h.name||L('default_hotel_name')}), loc:h.address||''}); });
  (t.itinerary||[]).forEach(l=>{ if (l.date) ev.push({date:l.date, time:l.departTime||'', title:(l.mode||'')+': '+(l.fromLabel||'')+' → '+(l.toLabel||''), loc:l.title||''}); });
  ev.push(...flightLegEvents(t.flightBack, L('flight_back_label')));
  ev.sort((a,b)=> (a.date+ (a.time||'99:99')).localeCompare(b.date+(b.time||'99:99')));
  return ev;
}
/* ---------- calendar export ----------
   The `downloads` capability only allows a fixed set of file extensions,
   and .ics is not one of them — so a real one-tap "add to calendar" file
   isn't possible on this platform. The closest working substitute is the
   classic Outlook/Google-Calendar CSV import format (works via each
   calendar's desktop "Import" menu). Per-event copy-to-clipboard (below)
   remains the best route for adding a single event on a phone. */
function csvEscape(s){
  s = String(s==null?'':s);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function fmtCsvDate(d){ const [y,m,dd] = d.split('-'); return `${m}/${dd}/${y}`; }
function fmtCsvTime(hm){
  let [hh,mm] = hm.split(':').map(Number);
  const ap = hh>=12 ? 'PM':'AM';
  let h12 = hh%12; if (h12===0) h12=12;
  return `${h12}:${String(mm).padStart(2,'0')} ${ap}`;
}
function addHourTime(hm){ let [hh,mm]=hm.split(':').map(Number); hh=(hh+1)%24; return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'); }
function buildCalendarCsv(t){
  const ev = buildEvents(t);
  const rows = [['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location']];
  ev.forEach(e=>{
    if (e.time) rows.push([e.title, fmtCsvDate(e.date), fmtCsvTime(e.time), fmtCsvDate(e.date), fmtCsvTime(addHourTime(e.time)), 'False', '', e.loc||'']);
    else rows.push([e.title, fmtCsvDate(e.date), '', fmtCsvDate(e.date), '', 'True', '', e.loc||'']);
  });
  return rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function renderReminders(t){

  return `
  <div class="screentitle">

  <div class="exportcard" id="exportCard">
    <div class="etitle">${escapeHtml(t.name||L('default_trip_name_export'))}</div>
    <div class="esub">${fmtDate(firstLeg(t.flightOut).date)} – ${fmtDate(firstLeg(t.flightBack).date)} · ${L('export_travelers_suffix',{n:t.travelers||1})}</div>

    <div class="eseg"><h4>${L('export_flight_section')}</h4>
      ${outLegs.map((l,i)=>flightRow(l,i,outLegs,L('export_flight_out_label'))).join('')}
      ${backLegs.map((l,i)=>flightRow(l,i,backLegs,L('export_flight_back_label'))).join('')}
    </div>

    ${(t.hotels||[]).length ? `<div class="eseg"><h4>${L('export_hotel_section')}</h4>${t.hotels.map(h=>`<div class="ehotel">${escapeHtml(h.name)} · ${fmtDate(h.checkin)}–${fmtDate(h.checkout)}</div>`).join('')}</div>`:''}

    ${legs.length ? `<div class="eseg"><h4>${L('export_route_section')}</h4>${legs.slice(0,8).map(l=>`<div class="eleg"><span>${fmtDate(l.date)} · ${escapeHtml(l.fromLabel)} → ${escapeHtml(l.toLabel)} (${escapeHtml(l.mode)})</span><span class="mono">${l.departTime||''}</span></div>`).join('')}</div>`:''}

    <div class="eseg"><h4>${L('export_budget_section')}</h4>
      <div class="eflight"><span>${L('export_spent_approx')}</span><span class="mono">${fmtYen(tripTotalSpend(t))}${t.budgetJpy?' / '+fmtYen(t.budgetJpy):''}</span></div>
    </div>

    <div class="efoot"><span>${L('export_footer')}</span><span>${new Date().toLocaleDateString(locale())}</span></div>
  </div>
  <button class="btn accent" id="btnExportImg">${ICON.down} ${L('export_img_btn')}</button>
  `;
}
function wireExport(t){
  document.getElementById('btnExportImg').addEventListener('click', async ()=>{
    if (!capDownloads) { toast(L('toast_downloads_unavailable')); return; }
    if (typeof html2canvas === 'undefined') { toast(L('toast_lib_load_fail')); return; }
    toast(L('toast_generating_image'));
    try {
      const canvas = await html2canvas(document.getElementById('exportCard'), {backgroundColor: getComputedStyle(document.body).getPropertyValue('background-color') || '#ffffff', scale:2});
      canvas.toBlob(async blob=>{
        try { await capDownloads.save({filename:(t.name||'trip')+'-summary.png', data: blob}); toast(L('toast_image_saved')); }
        catch(e){ if (e.code!=='declined') toast(L('toast_image_save_fail')); }
      }, 'image/png');
    } catch(e){ toast(L('toast_image_gen_fail')); }
  });
}

/* ---------- initial paint before capabilities resolve ---------- */
applyThemeChoice();
document.documentElement.lang = getLang()==='en' ? 'en' : 'th';
applyMoreBtnTitle();
renderNavLabels();
bootLocal();

/* ---------- resolve capabilities, then hand off to the real store ---------- */
(async () => {
  capDb = await safeUse('db');
  capSample = await safeUse('sample');
  capDownloads = await safeUse('downloads');
  capRoom = await safeUse('room');
  initStore();
  initRoomListeners();
  broadcastPresence();
  updatePresenceChip();
  await detectOwner();
  watchBanlist();
  // Note: we deliberately do NOT auto-pop the name modal on load anymore.
  // There's no platform capability that lets this page read the viewer's
  // real Claude account name, so the only "name" it could ever show is one
  // the person types in themselves — and forcing that every time they open
  // the app is just friction. The topbar chip (whoAmIBtn) stays as an
  // always-available, non-blocking way to set/change a display name.
})();
// safety net in case a host never answers window.claude.use at all
setTimeout(()=>{ if(!storeReady) initStore(); }, 2000);
</script>
